name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # hoặc 'master' nếu bạn dùng master branch
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # weekly data refresh (Mondays 03:00 UTC)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Best effort: fetch fresh data into public/data. If it fails (or the secret
      # is missing) the deploy continues with the data files committed in the repo.
      - name: Refresh Nookipedia data
        env:
          NOOKIPEDIA_API_KEY: ${{ secrets.NOOKIPEDIA_API_KEY }}
        run: npm run fetch-data || echo "::warning::Data refresh failed; deploying the committed data files."

      - name: Build with Next.js
        env:
          NODE_ENV: production
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
